name: Actualizar datos diarios de Meta Ads

# Corre todos los días, jala el resultado de ayer por campaña desde Meta
# y hace commit de data/daily.json. Requiere el secret META_ACCESS_TOKEN
# (Settings > Secrets and variables > Actions) para funcionar.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC = 08:00 hora Perú (UTC-5, sin horario de verano) — deja margen para que Meta termine de consolidar los datos de "ayer"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Jalar resultados de ayer por campaña
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python .github/scripts/update_daily_data.py

      - name: Commit si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/daily.json; then
            echo "Sin cambios en data/daily.json"
          else
            git add data/daily.json
            git commit -m "chore: actualizar resultados diarios de Meta Ads"
            git push
          fi
